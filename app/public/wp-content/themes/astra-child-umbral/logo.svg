<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradiente dorado elegante -->
    <linearGradient id="goldGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="20%" stop-color="#E8D5A3"/>
      <stop offset="40%" stop-color="#D4B87A"/>
      <stop offset="60%" stop-color="#C9A962"/>
      <stop offset="80%" stop-color="#B8943D"/>
      <stop offset="100%" stop-color="#9A7830"/>
    </linearGradient>
    
    <!-- Gradiente negro profundo -->
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="50%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="softShadowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Brillo dorado -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Máscara de recorte circular -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>
  
  <!-- Fondo circular negro -->
  <circle cx="200" cy="200" r="190" fill="url(#blackGrad)"/>
  
  <!-- Anillo exterior dorado -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGradLogo)" stroke-width="3" filter="url(#goldGlow)"/>
  
  <!-- Grupo principal con recorte circular -->
  <g clip-path="url(#circleClip)">
    
    <!-- Puerta/Umbral estilizada -->
    <g transform="translate(200, 180)">
      <!-- Marco de la puerta -->
      <rect x="-50" y="-60" width="100" height="120" rx="2" 
            fill="none" 
            stroke="url(#goldGradLogo)" 
            stroke-width="4"
            filter="url(#softShadowLogo)"/>
      
      <!-- Panel de puerta izquierdo (entreabierto) -->
      <rect x="-46" y="-56" width="44" height="112" fill="#1F1F1F"/>
      
      <!-- Panel de puerta derecho -->
      <rect x="2" y="-56" width="44" height="112" fill="#252525"/>
      
      <!-- Línea de bisagra decorativa -->
      <line x1="-2" y1="-50" x2="-2" y2="50" stroke="url(#goldGradLogo)" stroke-width="1.5" stroke-dasharray="4,4"/>
      
      <!-- Silueta de persona minimalista -->
      <g transform="translate(-10, 0)">
        <!-- Cabeza -->
        <circle cx="0" cy="-35" r="12" fill="url(#goldGradLogo)" filter="url(#goldGlow)"/>
        
        <!-- Cuerpo -->
        <path d="M -18 -20 
                 Q -20 10, -15 30 
                 Q -10 45, 0 50 
                 Q 10 45, 15 30 
                 Q 20 10, 18 -20 Z" 
              fill="url(#goldGradLogo)" 
              filter="url(#goldGlow)"/>
      </g>
      
      <!-- Rayos de luz (minimalistas) -->
      <g opacity="0.6">
        <line x1="50" y1="-20" x2="70" y2="-30" stroke="url(#goldGradLogo)" stroke-width="2" stroke-linecap="round"/>
        <line x1="50" y1="0" x2="75" y2="0" stroke="url(#goldGradLogo)" stroke-width="2" stroke-linecap="round"/>
        <line x1="50" y1="20" x2="70" y2="30" stroke="url(#goldGradLogo)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    
    <!-- Texto UMBRAL en la parte inferior -->
    <g transform="translate(200, 330)">
      <text x="0" y="0" 
            font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
            font-size="36" 
            font-weight="600" 
            fill="url(#goldGradLogo)"
            text-anchor="middle"
            letter-spacing="12"
            filter="url(#softShadowLogo)">
        UMBRAL
      </text>
      
      <!-- Línea decorativa -->
      <line x1="-60" y1="15" x2="60" y2="15" stroke="url(#goldGradLogo)" stroke-width="1"/>
    </g>
    
  </g>
  
  <!-- Texto del slogan (exterior del círculo) -->
  <text x="200" y="385" 
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
        font-size="11" 
        font-weight="300" 
        fill="#888888"
        text-anchor="middle"
        letter-spacing="3">
    ENTRE LO QUE ERES Y LO QUE VISTES
  </text>
</svg>
