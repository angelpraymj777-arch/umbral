<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <!-- Gold gradient for metallic effect -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8b8"/>
      <stop offset="25%" stop-color="#c1a364"/>
      <stop offset="50%" stop-color="#f3e8b8"/>
      <stop offset="75%" stop-color="#c1a364"/>
      <stop offset="100%" stop-color="#69522c"/>
    </linearGradient>

    <!-- Brushed metal texture filter -->
    <filter id="metalTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.5" numOctaves="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Drop shadow for depth -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Text gold gradient -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B08D57"/>
      <stop offset="100%" stop-color="#8B7345"/>
    </linearGradient>

    <!-- Circular frame gradient -->
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8b8"/>
      <stop offset="30%" stop-color="#c1a364"/>
      <stop offset="70%" stop-color="#9b844d"/>
      <stop offset="100%" stop-color="#69522c"/>
    </linearGradient>

    <!-- Center disc radial gradient -->
    <radialGradient id="discGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3a3d42"/>
      <stop offset="100%" stop-color="#232529"/>
    </radialGradient>

    <!-- Mannequin body gradient -->
    <linearGradient id="mannequinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69522c"/>
      <stop offset="20%" stop-color="#c1a364"/>
      <stop offset="40%" stop-color="#f3e8b8"/>
      <stop offset="60%" stop-color="#c1a364"/>
      <stop offset="100%" stop-color="#46371c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="#fcfbf8"/>

  <!-- Circular Frame -->
  <g id="frame">
    <!-- Outer thin ring -->
    <circle cx="250" cy="280" r="220" fill="none" stroke="url(#frameGold)" stroke-width="2"/>
    <!-- Dark thick ring -->
    <circle cx="250" cy="280" r="218" fill="none" stroke="#1a1b1e" stroke-width="18"/>
    <!-- Inner gold highlight ring -->
    <circle cx="250" cy="280" r="207" fill="none" stroke="url(#frameGold)" stroke-width="3"/>
    <!-- Central disc -->
    <circle cx="250" cy="280" r="204" fill="url(#discGrad)"/>
  </g>

  <!-- Mannequin / Dress Form -->
  <g id="mannequin" filter="url(#dropShadow)">
    <!-- Finial (top knob) -->
    <ellipse cx="250" cy="128" rx="8" ry="10" fill="url(#mannequinGrad)"/>
    <!-- Neck -->
    <rect x="245" y="135" width="10" height="20" rx="3" fill="url(#mannequinGrad)"/>
    <!-- Head/shoulders piece -->
    <path d="M195 165 Q195 150 250 150 Q305 150 305 165 Q305 180 290 190 L280 200 Q265 185 250 185 Q235 185 220 200 L210 190 Q195 180 195 165" fill="url(#mannequinGrad)"/>
    <!-- Torso -->
    <path d="M200 195 Q200 175 250 175 Q300 175 300 195 L310 260 Q310 340 250 340 Q190 340 190 260 Z" fill="url(#mannequinGrad)"/>
    <!-- Stand pole -->
    <rect x="246" y="335" width="8" height="100" rx="2" fill="url(#mannequinGrad)"/>
    <!-- Base - bottom ellipse -->
    <ellipse cx="250" cy="455" rx="45" ry="12" fill="url(#mannequinGrad)"/>
    <!-- Base - top ellipse -->
    <ellipse cx="250" cy="445" rx="35" ry="8" fill="url(#mannequinGrad)"/>
  </g>

  <!-- Measuring Tape -->
  <g id="tape" filter="url(#dropShadow)">
    <!-- Tape coil -->
    <ellipse cx="150" cy="350" rx="35" ry="25" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <ellipse cx="150" cy="350" rx="22" ry="15" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <ellipse cx="150" cy="350" rx="10" ry="7" fill="url(#goldGrad)"/>
    <!-- Ribbon extending -->
    <path d="M180 360 Q200 400 250 420 Q300 440 350 400"
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Ribbon thickness edge (3D effect) -->
    <path d="M180 365 Q200 405 250 425 Q300 445 350 405"
          fill="none" stroke="#46371c" stroke-width="3" stroke-linecap="round"/>
    <!-- Tick marks -->
    <g stroke="#46371c" stroke-width="1.5">
      <line x1="210" y1="395" x2="210" y2="405"/>
      <line x1="240" y1="410" x2="240" y2="420"/>
      <line x1="270" y1="420" x2="270" y2="430"/>
      <line x1="300" y1="425" x2="300" y2="435"/>
      <line x1="330" y1="420" x2="330" y2="430"/>
    </g>
  </g>

  <!-- Scissors -->
  <g id="scissors" filter="url(#dropShadow)">
    <!-- Blade 1 (back) -->
    <path d="M320 380 L360 330" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Blade 2 (front) -->
    <path d="M330 385 L370 340" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Pivot screw -->
    <circle cx="325" cy="375" r="6" fill="url(#goldGrad)"/>
    <circle cx="325" cy="375" r="3" fill="#46371c"/>
    <!-- Handle 1 -->
    <ellipse cx="310" cy="390" rx="18" ry="12" fill="none" stroke="url(#goldGrad)" stroke-width="5" transform="rotate(-20 310 390)"/>
    <!-- Handle 2 -->
    <ellipse cx="335" cy="395" rx="16" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="5" transform="rotate(15 335 395)"/>
  </g>

  <!-- Typography -->
  <text x="250" y="530" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#9b844d" letter-spacing="6" font-weight="500">CONFECCIÓN</text>
  <text x="250" y="565" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#9b844d" letter-spacing="6" font-weight="500">DE AUTOR</text>

  <!-- Decorative line -->
  <line x1="150" y1="585" x2="350" y2="585" stroke="#9b844d" stroke-width="1"/>
</svg>