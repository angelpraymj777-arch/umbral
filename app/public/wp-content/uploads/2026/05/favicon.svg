<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="30%" stop-color="#E8D5A3"/>
      <stop offset="50%" stop-color="#D4B87A"/>
      <stop offset="70%" stop-color="#C9A962"/>
      <stop offset="100%" stop-color="#9A7830"/>
    </linearGradient>
    
    <linearGradient id="blackGradFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    
    <filter id="glowFav">
      <feGaussianBlur stdDeviation="1" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#blackGradFav)"/>
  
  <!-- Marco circular exterior -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldGradFav)" stroke-width="1.5"/>
  
  <!-- Puerta/Umbral -->
  <g transform="translate(32, 28)">
    <!-- Marco -->
    <rect x="-14" y="-16" width="28" height="32" rx="1" 
          fill="none" 
          stroke="url(#goldGradFav)" 
          stroke-width="2"/>
    
    <!-- Puerta entreabierta -->
    <rect x="-11" y="-13" width="11" height="26" fill="#1F1F1F"/>
    <rect x="1" y="-13" width="10" height="26" fill="#252525"/>
    
    <!-- Bisagra -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="url(#goldGradFav)" stroke-width="0.75" stroke-dasharray="2,2"/>
    
    <!-- Persona minimalista -->
    <circle cx="-4" cy="-8" r="4" fill="url(#goldGradFav)" filter="url(#glowFav)"/>
    <ellipse cx="-4" cy="4" rx="5" ry="7" fill="url(#goldGradFav)" filter="url(#glowFav)"/>
  </g>
  
  <!-- Letra U estilizada en la base -->
  <text x="32" y="56" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="10" 
        font-weight="600" 
        fill="url(#goldGradFav)"
        text-anchor="middle"
        letter-spacing="2">
    U
  </text>
</svg>
